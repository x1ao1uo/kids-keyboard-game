<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小动物乐园</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", system-ui, sans-serif;
    user-select: none;
    background: linear-gradient(180deg, #FFE9F2 0%, #FFF6E0 50%, #E8F4FF 100%);
    transition: background 0.6s ease;
  }
  #hint {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.75); color: #555;
    padding: 16px 37px; border-radius: 37px;
    font-size: 37px; font-weight: 700; pointer-events: none;
    z-index: 10;
  }
  #pet {
    position: fixed;
    left: 50%; top: 50%;
    width: 1066px; height: 1066px;
    transform: translate(-50%, -50%);
    transition: transform 0.12s ease-out;
    pointer-events: none;
    will-change: transform;
  }
  #pet.bounce {
    transform: translate(-50%, -50%) scale(1.12) rotate(-6deg);
  }
  .spark {
    position: fixed;
    width: 426px; height: 426px;
    pointer-events: none;
    animation: pop 1s forwards;
  }
  @keyframes pop {
    0%   { transform: translate(-50%, -50%) scale(0.2) rotate(0);   opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(2.4) rotate(180deg); opacity: 0; }
  }
</style>
</head>
<body>
<div id="hint">按 空格 / 回车 切换小动物</div>
<img id="pet" src="emojis/1f425.svg" alt="">

<script>
(function () {
  "use strict";

  // 0~3 岁友好的萌物集合（40 个，超高清 Twemoji 矢量 SVG）
  var PETS = [
    { id: "1f436", name: "小狗"   },
    { id: "1f431", name: "小猫"   },
    { id: "1f430", name: "小兔子" },
    { id: "1f439", name: "小仓鼠" },
    { id: "1f42d", name: "小老鼠" },
    { id: "1f43b", name: "小熊"   },
    { id: "1f43c", name: "大熊猫" },
    { id: "1f428", name: "小考拉" },
    { id: "1f42f", name: "小老虎" },
    { id: "1f981", name: "小狮子" },
    { id: "1f42e", name: "小牛"   },
    { id: "1f437", name: "小猪"   },
    { id: "1f435", name: "小猴子" },
    { id: "1f98a", name: "小狐狸" },
    { id: "1f992", name: "长颈鹿" },
    { id: "1f418", name: "大象"   },
    { id: "1f993", name: "斑马"   },
    { id: "1f998", name: "袋鼠"   },
    { id: "1f414", name: "小鸡"   },
    { id: "1f424", name: "小鸡"   },
    { id: "1f425", name: "小鸡"   },
    { id: "1f426", name: "小鸟"   },
    { id: "1f427", name: "企鹅"   },
    { id: "1f986", name: "小鸭子" },
    { id: "1f99a", name: "天鹅"   },
    { id: "1f99b", name: "孔雀"   },
    { id: "1f99c", name: "小鹦鹉" },
    { id: "1f989", name: "猫头鹰" },
    { id: "1f985", name: "老鹰"   },
    { id: "1f413", name: "大公鸡" },
    { id: "1f42c", name: "小海豚" },
    { id: "1f433", name: "大鲸鱼" },
    { id: "1f420", name: "小鱼"   },
    { id: "1f419", name: "章鱼"   },
    { id: "1f422", name: "小乌龟" },
    { id: "1f41d", name: "小蜜蜂" },
    { id: "1f98b", name: "小蝴蝶" },
    { id: "1f984", name: "独角兽" },
    { id: "1f434", name: "小马"   },
    { id: "1f411", name: "小绵羊" },
  ];
  var SPARKS = [
    "2b50",  // ⭐
    "1f31f", // 🌟
    "2728",  // ✨
    "1f496", // 💖
    "1f308", // 🌈
    "1f388", // 🎈
    "1f36a", // 🍭
  ];

  var pet = document.getElementById("pet");
  var petIdx = 0;

  // 中文 TTS：每个动物名预生成的 mp3（微软云希 XiaoxiaoNeural）
  var ttsAudio = new Audio();
  ttsAudio.preload = "auto";
  function speakName(idx) {
    var p = PETS[idx];
    ttsAudio.pause();
    ttsAudio.currentTime = 0;
    ttsAudio.src = "tts/" + p.id + ".mp3";
    var p2 = ttsAudio.play();
    if (p2 && p2.catch) p2.catch(function () {});
  }

  function spawnSparks() {
    var cx = window.innerWidth / 2;
    var cy = window.innerHeight / 2;
    for (var i = 0; i < 4; i++) {
      var s = document.createElement("img");
      s.className = "spark";
      s.src = "emojis/" + SPARKS[Math.floor(Math.random() * SPARKS.length)] + ".svg";
      s.style.left = (cx + (Math.random() - 0.5) * 533) + "px";
      s.style.top  = (cy + (Math.random() - 0.5) * 533) + "px";
      document.body.appendChild(s);
      (function (n) { setTimeout(function () { n.remove(); }, 1000); })(s);
    }
  }

  function cyclePet() {
    petIdx = (petIdx + 1) % PETS.length;
    var p = PETS[petIdx];
    pet.src = "emojis/" + p.id + ".svg";
    pet.classList.add("bounce");
    setTimeout(function () { pet.classList.remove("bounce"); }, 110);
    spawnSparks();
    speakName(petIdx);
  }

  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("keydown", function (e) {
    if (e.repeat) return;
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      cyclePet();
    }
  });
})();
</script>
</body>
</html>
