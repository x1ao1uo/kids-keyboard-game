<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小动物跑跑跑 · 方向键乐园</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", system-ui, sans-serif;
    user-select: none;
    background: linear-gradient(180deg, #FFE9F2 0%, #FFF6E0 50%, #E8F4FF 100%);
    transition: background 0.6s ease;
  }
  #hint {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.75); color: #555;
    padding: 16px 37px; border-radius: 37px;
    font-size: 37px; font-weight: 700; pointer-events: none;
    z-index: 10;
  }
  #pet {
    position: absolute;
    width: 1066px; height: 1066px;
    transition: transform 0.12s ease-out;
    pointer-events: none;
    will-change: transform;
    transform-origin: 50% 50%;
  }
  #pet.bounce { transform: scale(1.08) rotate(-6deg); }
  .spark {
    position: absolute;
    width: 426px; height: 426px;
    pointer-events: none;
    animation: pop 1s forwards;
  }
  @keyframes pop {
    0%   { transform: translate(-50%, -50%) scale(0.2) rotate(0);   opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(2.4) rotate(180deg); opacity: 0; }
  }
  .paw {
    position: absolute;
    width: 320px; height: 320px;
    pointer-events: none;
    animation: paw 1.4s forwards;
    opacity: 0.65;
  }
  @keyframes paw {
    0%   { transform: translate(-50%, -50%) scale(0.5); opacity: 0.65; }
    100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
  }
</style>
</head>
<body>
<div id="hint">按 ↑ ↓ ← → 让小动物跑起来</div>
<img id="pet" src="emojis/1f425.svg" alt="">

<script>
(function () {
  "use strict";

  // 0~3 岁友好的萌物集合（共 40 个，超高清 Twemoji 矢量 SVG 已在仓库 emojis/ 里）
  // 排除蛇/鳄鱼/蜘蛛/鲨鱼/蜥蜴/蝙蝠/恐龙/龙 等可能吓到小孩的
  var PETS = [
    { id: "1f436", name: "小狗"   },
    { id: "1f431", name: "小猫"   },
    { id: "1f430", name: "小兔子" },
    { id: "1f439", name: "小仓鼠" },
    { id: "1f42d", name: "小老鼠" },
    { id: "1f43b", name: "小熊"   },
    { id: "1f43c", name: "大熊猫" },
    { id: "1f428", name: "小考拉" },
    { id: "1f42f", name: "小老虎" },
    { id: "1f981", name: "小狮子" },
    { id: "1f42e", name: "小牛"   },
    { id: "1f437", name: "小猪"   },
    { id: "1f435", name: "小猴子" },
    { id: "1f98a", name: "小狐狸" },
    { id: "1f992", name: "长颈鹿" },
    { id: "1f418", name: "大象"   },
    { id: "1f993", name: "斑马"   },
    { id: "1f998", name: "袋鼠"   },
    { id: "1f414", name: "小鸡"   },
    { id: "1f424", name: "小鸡"   },
    { id: "1f425", name: "小鸡"   },
    { id: "1f426", name: "小鸟"   },
    { id: "1f427", name: "企鹅"   },
    { id: "1f986", name: "小鸭子" },
    { id: "1f99a", name: "天鹅"   },
    { id: "1f99b", name: "孔雀"   },
    { id: "1f99c", name: "小鹦鹉" },
    { id: "1f989", name: "猫头鹰" },
    { id: "1f985", name: "老鹰"   },
    { id: "1f413", name: "大公鸡" },
    { id: "1f42c", name: "小海豚" },
    { id: "1f433", name: "大鲸鱼" },
    { id: "1f420", name: "小鱼"   },
    { id: "1f419", name: "章鱼"   },
    { id: "1f422", name: "小乌龟" },
    { id: "1f41d", name: "小蜜蜂" },
    { id: "1f98b", name: "小蝴蝶" },
    { id: "1f984", name: "独角兽" },
    { id: "1f434", name: "小马"   },
    { id: "1f411", name: "小绵羊" },
  ];
  var SPARKS = [
    "2b50",  // ⭐
    "1f31f", // 🌟
    "2728",  // ✨
    "1f496", // 💖
    "1f308", // 🌈
    "1f388", // 🎈
    "1f36a", // 🍭
  ];

  // C 大调音阶：移动用随机叮，切换用上行三音小旋律
  var NOTES = [262, 294, 330, 349, 392, 440, 494, 523, 587, 659];

  // 中文 TTS：切换动物时念出名字（macOS 优先 Tingting / Mei-jia / Sin-ji）
  var preferredVoiceZh = null;
  function pickZhVoice() {
    if (!window.speechSynthesis) return;
    var voices = window.speechSynthesis.getVoices();
    if (!voices.length) return;
    var prefs = [
      /Tingting/i,
      /Mei-?jia/i,
      /Sin-?ji/i,
      /Microsoft .*Chinese/i,
      /Microsoft .*Yaoyao/i,
      /Google 普通话/i,
    ];
    for (var i = 0; i < prefs.length; i++) {
      var v = voices.find(function (voice) { return prefs[i].test(voice.name); });
      if (v) { preferredVoiceZh = v; return; }
    }
    preferredVoiceZh = voices.find(function (v) { return /^zh/i.test(v.lang); }) || null;
  }
  if (window.speechSynthesis) {
    pickZhVoice();
    window.speechSynthesis.onvoiceschanged = pickZhVoice;
  }
  function speakZh(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    u.rate = 0.85;   // 稍慢，便于小孩听清
    u.pitch = 1.15;  // 略高，更亲切
    if (preferredVoiceZh) u.voice = preferredVoiceZh;
    window.speechSynthesis.speak(u);
  }

  var pet = document.getElementById("pet");
  var SIZE = 1066;       // 体积 ×2/3（在原 1600 基础上）
  var STEP = 146;        // 一按一下，明显移动
  var petIdx = 0;
  var audioCtx = null;

  // 起始居中（允许部分溢出屏幕，给"巨大萌物"的感觉）
  var x = window.innerWidth / 2 - SIZE / 2;
  var y = window.innerHeight / 2 - SIZE / 2;

  function place() {
    pet.style.left = x + "px";
    pet.style.top  = y + "px";
  }
  place();

  function file(name) { return "emojis/" + name + ".svg"; }

  // —— 轻音乐（Web Audio 合成，不依赖外部资源） ——
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function tone(type, freqStart, freqEnd, startTime, duration, volume) {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freqStart, startTime);
    if (freqEnd !== freqStart) {
      osc.frequency.exponentialRampToValueAtTime(freqEnd, startTime + duration);
    }
    gain.gain.setValueAtTime(volume, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration);
  }

  // 移动：柔和短"叮"（正弦 + 高八度泛音，像风铃）
  function playStep() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    var f = NOTES[Math.floor(Math.random() * NOTES.length)];
    tone("sine", f, f, t, 0.22, 0.20);
    tone("sine", f * 2, f * 2, t, 0.18, 0.07);
  }

  // 切动物：上行三音小旋律（柔和三角波 + 风铃点缀）
  function playSwitch() {
    if (!audioCtx) return;
    var t0 = audioCtx.currentTime;
    var seq = [NOTES[0], NOTES[2], NOTES[4]]; // C E G
    for (var i = 0; i < seq.length; i++) {
      var f = seq[i];
      tone("triangle", f, f, t0 + i * 0.18, 0.28, 0.22);
      tone("sine",     f * 2, f * 2, t0 + i * 0.18, 0.22, 0.07);
    }
  }

  function spawnSparks() {
    for (var i = 0; i < 4; i++) {
      var s = document.createElement("img");
      s.className = "spark";
      s.src = file(SPARKS[Math.floor(Math.random() * SPARKS.length)]);
      s.style.left = (x + SIZE / 2 + (Math.random() - 0.5) * 533) + "px";
      s.style.top  = (y + SIZE / 2 + (Math.random() - 0.5) * 533) + "px";
      document.body.appendChild(s);
      (function (n) { setTimeout(function () { n.remove(); }, 1000); })(s);
    }
  }

  function leavePaw() {
    var p = document.createElement("img");
    p.className = "paw";
    p.src = file("1f43e"); // 🐾
    p.style.left = (x + SIZE / 2) + "px";
    p.style.top  = (y + SIZE / 2) + "px";
    document.body.appendChild(p);
    setTimeout(function () { p.remove(); }, 1400);
  }

  function move(dx, dy) {
    // 允许溢出到屏幕外一整身，小动物可以"爬出再爬回"，巨大感更足
    x = Math.max(-SIZE / 2, Math.min(window.innerWidth  - SIZE / 2, x + dx));
    y = Math.max(-SIZE / 2, Math.min(window.innerHeight - SIZE / 2, y + dy));
    place();
    pet.classList.add("bounce");
    setTimeout(function () { pet.classList.remove("bounce"); }, 110);
    spawnSparks();
    leavePaw();
    playStep();
  }

  function cyclePet() {
    petIdx = (petIdx + 1) % PETS.length;
    var p = PETS[petIdx];
    pet.src = file(p.id);
    spawnSparks();
    playSwitch();
    speakZh(p.name);
  }

  // 拦截右键、误关标签页；小孩一通乱按也不影响
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("beforeunload", function (e) {
    e.preventDefault(); e.returnValue = "";
  });

  document.addEventListener("keydown", function (e) {
    e.preventDefault();
    if (e.repeat) return;
    ensureAudio(); // 第一次按键时激活音频
    switch (e.key) {
      case "ArrowUp":    move(0, -STEP); break;
      case "ArrowDown":  move(0,  STEP); break;
      case "ArrowLeft":  move(-STEP, 0); break;
      case "ArrowRight": move( STEP, 0); break;
      case " ":          cyclePet();     break; // 空格换动物（彩蛋）
    }
  });
})();
</script>
</body>
</html>
